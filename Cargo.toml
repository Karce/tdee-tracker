[package]
name = "tdee-tracker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tdee"
path = "src/main.rs"

[dependencies]
age = "0.10"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
secrecy = "0.8"
tempfile = "3"
